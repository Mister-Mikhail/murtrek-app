name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} 2>&1 | tee build.log

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk murtrek-${{ github.run_number }}.apk
          SHA=$(sha256sum murtrek-${{ github.run_number }}.apk | cut -d' ' -f1)
          {
            git log -1 --pretty=%s
            echo
            echo "MURTREK_VERSION_CODE=${{ github.run_number }}"
            echo "MURTREK_SHA256=$SHA"
          } > notes.txt
          cat notes.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" "murtrek-${{ github.run_number }}.apk" \
            --title "MURTREK 0.1.${{ github.run_number }}" --notes-file notes.txt --target "${{ github.sha }}"

      - name: Publish build log to branch ci-logs
        if: always()
        run: |
          mkdir -p /tmp/cilog
          (tail -n 300 build.log 2>/dev/null || echo "no build log") > /tmp/cilog/last-build.log
          echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}" > /tmp/cilog/status.txt
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
